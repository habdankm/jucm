// service-app - JUCM pretending to be a service, delivered as ONE NATIVE BINARY.
//
// Zero Java on the target. The binary carries JUCM (its configuration) and JUSL (the service registration) inside
// itself, which is the only reason it can be carried into a guest as a single file and register ITSELF there.
//
// The native recipe is copied from ../native-app, deliberately and with its reasons intact: the workaround for
// native-build-tools#542, and the rule that the GraalVM path comes from THE CALLER so that a machine without
// GraalVM can still run a plain `check`.
//
// Build:  ./gradlew :integration-tests:service-app:nativeCompile \
//             -Porg.gradle.java.installations.paths=/path/to/graalvm     (or GRAALVM_HOME)

plugins {
    id 'application'
    id 'org.graalvm.buildtools.native' version '1.1.9'
}

repositories {
    mavenLocal()      // our artifacts first: JUCM and JUSL are both consumed as external jars
    mavenCentral()
}

dependencies {
    // The registration library, from its own repository. It is NOT published anywhere else, and that is on purpose:
    // a library offered to anyone is a promise, and this one is still being decided.
    implementation 'dev.jusl:service-lib:1.0'
    implementation 'dev.jucm:config-core:1.0'
    implementation 'dev.jucm:config-toolbox:1.0'
}

def graalvmGiven = providers.gradleProperty('org.gradle.java.installations.paths').isPresent()
    || providers.environmentVariable('GRAALVM_HOME').isPresent()

graalvmNative {
    toolchainDetection = false
    binaries {
        main {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(25)
                if (graalvmGiven) {
                    vendor = JvmVendorSpec.GRAAL_VM
                }
            }
            // The name somebody will type on a machine that has no JVM at all.
            imageName = 'jusl-service'
        }
    }
}

application {
    mainClass = 'dev.jucm.service.JuslService'
    applicationName = 'jusl-service'
}

// The first build cannot assume somebody ran publishToMavenLocal in the sibling repository by hand, and "Could not
// find dev.jusl:service-lib" says nothing about what to do. This says what to do.
tasks.register('verifyJuslPublished') {
    description = 'Fails with an instruction, not with a missing-artifact stack, when JUSL is not in mavenLocal.'
    def where = new File(System.getProperty('user.home'), '.m2/repository/dev/jusl/service-lib/1.0')
    doLast {
        if (!where.isDirectory()) {
            throw new GradleException("dev.jusl:service-lib:1.0 is not in mavenLocal.\n"
                    + "  Publish it first:   (cd ../jusm && ./gradlew publishToMavenLocal)")
        }
        println "ok: JUSL found in mavenLocal"
    }
}

tasks.withType(JavaCompile).configureEach { dependsOn 'verifyJuslPublished' }
tasks.named('nativeCompile') { dependsOn 'verifyJuslPublished' }
