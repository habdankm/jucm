# Gradle properties for the JUCM project.
#
# There are deliberately no JDK/GraalVM paths here: the repository must stay portable, and
# /home/<user>/graalvm is a machine-specific path. How to point the native build at GraalVM:
#
#   1) local.properties (git-ignored)          — org.gradle.java.installations.paths=/path/to/graalvm
#   2) globally, in ~/.gradle/gradle.properties — the same setting for all projects
#   3) the GRAALVM_HOME variable — when the installation is in the standard location
#
# No LIBRARY module requires GraalVM, and there is no native script in this repository.
# GraalVM is pointed out only so that the APPLICATION in `integration-tests/native-app` — the
# only module with the native plugin — can be built.

org.gradle.daemon=true
org.gradle.parallel=true
